  <script>
  const resetLoginButton =

const forecastButton =

const forecastBreakdown =

const gouzetsuStart =

const gouzetsuOrbTotal =

const gouzetsuCountdown =
  document.getElementById("gouzetsuCountdown");

  const contentsData = [
  {
    id: "tenma",

    icon: "images/tenma.png",
    orb: 5,
    startDay: 1,

  {

  },
  {
    id: "mikai",
    name: "未開の幻洞",
    icon: "images/mikai.png",
    orb: 10,
    startDay: 14,
    endDay: 29,
    crossMonth: false,
  },
  {
    id: "kinki",
    name: "禁忌の獄",
    icon: "images/kinki.png",
    orb: 55,
    startDay: 21,
    endDay: 8,
    crossMonth: true,
  },
  {
    id: "tournament",
    name: "絶級トーナメント",
    icon: "images/tournament.png",
    orb: 30,
    startDay: 26,
    endDay: 6,
    crossMonth: true,
    
  },
  {
    id: "seibo",
    name: "破界の星墓",
    icon: "images/seibo.png",
    orb: 20,
    startDay: 27,
    endDay: 21,
    crossMonth: true,
  }
];

  function getPeriod(content) {
    const now = new Date();

    const year = now.getFullYear();
    const month = now.getMonth();

    // 天魔の孤城：毎月1日12時に更新
    if (content.monthlyReset) {
      let startDate = new Date(
        year,
        month,
        1,
        12,
        0,
        0
      );

      let endDate = new Date(
        year,
        month + 1,
        1,
        12,
        0,
        0
      );

      if (now < startDate) {
        startDate = new Date(
          year,
          month - 1,
          1,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month,
          1,
          12,
          0,
          0
        );
      }

      return {
        start: startDate,
        end: endDate
      };
    }

    // 月をまたぐコンテンツ
    if (content.crossMonth) {
      const thisMonthStart = new Date(
        year,
        month,
        content.startDay,
        12,
        0,
        0
      );

      let startDate;
      let endDate;

      if (now >= thisMonthStart) {
        startDate = thisMonthStart;

        endDate = new Date(
          year,
          month + 1,
          content.endDay,
          12,
          0,
          0
        );
      } else {
        const previousStart = new Date(
          year,
          month - 1,
          content.startDay,
          12,
          0,
          0
        );

        const previousEnd = new Date(
          year,
          month,
          content.endDay,
          12,
          0,
          0
        );

        if (now <= previousEnd) {
          startDate = previousStart;
          endDate = previousEnd;
        } else {
          startDate = thisMonthStart;

          endDate = new Date(
            year,
            month + 1,
            content.endDay,
            12,
            0,
            0
          );
        }
      }

      return {
        start: startDate,
        end: endDate
      };
    }

    // 同じ月の中で完結するコンテンツ
    let startDate = new Date(
      year,
      month,
      content.startDay,
      12,
      0,
      0
    );

    let endDate = new Date(
      year,
      month,
      content.endDay,
      12,
      0,
      0
    );

    if (now > endDate) {
      startDate = new Date(
        year,
        month + 1,
        content.startDay,
        12,
        0,
        0
      );

      endDate = new Date(
        year,
        month + 1,
        content.endDay,
        12,
        0,
        0
      );
    }

    return {
      start: startDate,
      end: endDate
    };
  }
function getStatusOrder(content) {
  const now = new Date();
  const period = getPeriod(content);

  if (now >= period.start && now <= period.end) {
    return 0; // 開催中
  }

  if (now < period.start) {
    return 1; // 開催前
  }

  return 2; // 終了
}

const displayOrder = [
  "tenma",
  "hasya",
  "mikai",
  "kinki",
  "tournament",
  "seibo"
];

contentsData.sort(function(a, b) {
  const statusA = getStatusOrder(a);
  const statusB = getStatusOrder(b);

  if (statusA !== statusB) {
    return statusA - statusB;
  }

  return (
    displayOrder.indexOf(a.id) -
    displayOrder.indexOf(b.id)
  );
});
  function createContents() {
  contentList.innerHTML = "";

  let currentGroup = "";

  contentsData.forEach(function(content) {
    const now = new Date();
    const period = getPeriod(content);

    let groupName = "";

    if (now >= period.start && now <= period.end) {
      groupName = "開催中";
    } else if (now < period.start) {
      groupName = "開催前";
    } else {
      groupName = "終了";
    }

    // グループが変わったら見出しを追加
    if (groupName !== currentGroup) {
      const heading = document.createElement("h2");
      heading.className = "section-title";
      heading.textContent = groupName;

      contentList.appendChild(heading);

      currentGroup = groupName;
    }

    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = content.id;

    card.innerHTML = `
  <label class="content-label">
    <input
      type="checkbox"
      class="content"
      id="${content.id}"
      data-orb="${content.orb}"
    >

    <img
      src="${content.icon}"
      alt="${content.name}"
      class="content-image"
    >

    <span class="content-name">
      ${content.name}：${content.orb}個
    </span>
  </label>

  <p id="${content.id}Countdown">
    計算中...
  </p>
`;

    contentList.appendChild(card);
  });
  }

  createContents();

  const checkboxes =
    document.querySelectorAll(".content");
function calculateLoginOrb() {
  const now = new Date();

  let savedStart =
    localStorage.getItem("loginOrbStart");

  let startDate;

  if (savedStart === null) {
    startDate = new Date();

    localStorage.setItem(
      "loginOrbStart",
      startDate.toISOString()
    );
  } else {
    startDate = new Date(savedStart);
  }

  // リセット後、最初に来る朝4:00
  let firstReward = new Date(startDate);

  firstReward.setHours(4, 0, 0, 0);

  if (startDate >= firstReward) {
    firstReward.setDate(
      firstReward.getDate() + 1
    );
  }

  const oneDay =
    24 * 60 * 60 * 1000;

  let rewardCount = 0;

  if (now >= firstReward) {
    rewardCount =
      Math.floor(
        (now - firstReward) / oneDay
      ) + 1;
  }

  // 毎朝4時ごとに2個
  const orb =
    rewardCount * 2;

  loginOrbTotal.textContent = 2;
  loginOrbEarned.textContent = orb;
  calculateTotal();

  // 次の朝4:00
  const nextReward =
    new Date(
      firstReward.getTime() +
      rewardCount * oneDay
    );

  const diff =
    nextReward - now;

  const hours =
    Math.floor(
      diff / (1000 * 60 * 60)
    );

  const minutes =
    Math.floor(
      (diff / (1000 * 60)) % 60
    );

  const seconds =
    Math.floor(
      (diff / 1000) % 60
    );

  loginCountdown.textContent =
    "次回獲得まで：" +
    hours + "時間 " +
    minutes + "分 " +
    seconds + "秒";

  return orb;
}

function calculateGouzetsuOrb() {
  if (!gouzetsuStart.value) {
    gouzetsuOrbTotal.textContent = "0";
    gouzetsuCountdown.textContent =
      "開始日時を設定してください";

    return 0;
  }

  const start = new Date(gouzetsuStart.value);
  const now = new Date();

  const oneWeek =
    7 * 24 * 60 * 60 * 1000;

  const elapsed = now - start;

  if (elapsed < 0) {
    gouzetsuOrbTotal.textContent = "0";
    gouzetsuCountdown.textContent =
      "開始前です";

    return 0;
  }

  const weeksPassed =
    Math.floor(elapsed / oneWeek);

  const orb = weeksPassed * 5;

  gouzetsuOrbTotal.textContent = orb;

  const nextDate =
    new Date(
      start.getTime() +
      (weeksPassed + 1) * oneWeek
    );

  gouzetsuCountdown.textContent =
    "次回獲得まで：" +
    formatTime(nextDate - now);

  return orb;
}
function autoSelectForecastContents() {
  if (!forecastStart.value || !forecastEnd.value) {
    return;
  }

  const rangeStart =
    new Date(forecastStart.value + "T00:00:00");

  const rangeEnd =
    new Date(forecastEnd.value + "T23:59:59");

  if (rangeEnd < rangeStart) {
    return;
  }

  forecastCheckboxes.forEach(function(checkbox) {
    const content = contentsData.find(function(item) {
      return item.id === checkbox.value;
    });

    if (!content) {
      checkbox.checked = false;
      return;
    }

    let isIncluded = false;

    // 開始月の1か月前から確認
    let year = rangeStart.getFullYear();
    let month = rangeStart.getMonth() - 1;

    if (month < 0) {
      month = 11;
      year--;
    }

    const endYear = rangeEnd.getFullYear();
    const endMonth = rangeEnd.getMonth();

    while (
      year < endYear ||
      (year === endYear && month <= endMonth)
    ) {
      let startDate;
      let endDate;

      if (content.monthlyReset) {
        startDate = new Date(
          year,
          month,
          1,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month + 1,
          1,
          12,
          0,
          0
        );

      } else if (content.crossMonth) {
        startDate = new Date(
          year,
          month,
          content.startDay,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month + 1,
          content.endDay,
          12,
          0,
          0
        );

      } else {
        startDate = new Date(
          year,
          month,
          content.startDay,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month,
          content.endDay,
          12,
          0,
          0
        );
      }

      if (
        startDate <= rangeEnd &&
        endDate >= rangeStart
      ) {
        isIncluded = true;
        break;
      }

      month++;

      if (month > 11) {
        month = 0;
        year++;
      }
    }

    checkbox.checked = isIncluded;
  });
}
function formatForecastDate(date) {
  return (
    (date.getMonth() + 1) +
    "/" +
    date.getDate()
  );
}
function updateForecastTotal() {
  let total = 0;

  const checkedEvents =
    document.querySelectorAll(
      ".forecast-event:checked"
    );

  checkedEvents.forEach(function(checkbox) {
    total += Number(checkbox.dataset.orb);
  });

  forecastOrbTotal.textContent = total;
}
function calculateTotal() {
  let totalOrbs = 0;

  // 定期コンテンツのチェック済みオーブ
  checkboxes.forEach(function(checkbox) {
    if (checkbox.checked) {
      const content = contentsData.find(function(item) {
        return item.id === checkbox.id;
      });

      if (content) {
        totalOrbs += content.orb;
      }
    }
  });

  // ログインオーブ
  const loginOrbs =
    Number(loginOrbEarned.textContent) || 0;

  // 轟絶ボーナス
  const gouzetsuOrbs =
    Number(gouzetsuOrbTotal.textContent) || 0;

  totalOrbs += loginOrbs;
  totalOrbs += gouzetsuOrbs;

  total.textContent = totalOrbs;
}
function generateForecastEvents() {
  if (!forecastStart.value || !forecastEnd.value) {
    forecastEventList.innerHTML =
      "<p>開始日と終了日を選択してください。</p>";
    return;
  }

  const rangeStart =
    new Date(forecastStart.value + "T00:00:00");

  const rangeEnd =
    new Date(forecastEnd.value + "T23:59:59");

  if (rangeEnd < rangeStart) {
    forecastEventList.innerHTML =
      "<p>終了日は開始日以降にしてください。</p>";
    return;
  }

  forecastEventList.innerHTML = "";

  let eventNumber = 0;

  contentsData.forEach(function(content) {

    // 月をまたぐイベントを拾うため、
    // 開始日の1か月前から調べる
    let year = rangeStart.getFullYear();
    let month = rangeStart.getMonth() - 1;

    if (month < 0) {
      month = 11;
      year--;
    }

    const endYear = rangeEnd.getFullYear();
    const endMonth = rangeEnd.getMonth();

    while (
      year < endYear ||
      (year === endYear && month <= endMonth)
    ) {
      let startDate;
      let endDate;

      if (content.monthlyReset) {

        startDate = new Date(
          year,
          month,
          1,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month + 1,
          1,
          12,
          0,
          0
        );

      } else if (content.crossMonth) {

        startDate = new Date(
          year,
          month,
          content.startDay,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month + 1,
          content.endDay,
          12,
          0,
          0
        );

      } else {

        startDate = new Date(
          year,
          month,
          content.startDay,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month,
          content.endDay,
          12,
          0,
          0
        );
      }

      // 指定期間と開催期間が重なっている場合
      if (
        startDate <= rangeEnd &&
        endDate >= rangeStart
      ) {
        eventNumber++;

        const row =
          document.createElement("div");

        row.className = "forecast-event-row";

        row.innerHTML = `
          <label>
            <input
              type="checkbox"
              class="forecast-event"
              data-orb="${content.orb}"
              data-name="${content.name}"
              checked
            >

            <img
      src="${content.icon}"
      alt="${content.name}"
      class="forecast-event-icon"
            >

            ${content.name}
            （${formatForecastDate(startDate)}
            ～${formatForecastDate(endDate)}）
            ：${content.orb}個
          </label>
        `;
        const eventCheckbox =
        row.querySelector(".forecast-event");

        eventCheckbox.dataset.period =
        formatForecastDate(startDate) 
        +"～" +
        formatForecastDate(endDate);
        
        eventCheckbox.dataset.icon =
        content.icon;

        forecastEventList.appendChild(row);
      }

      month++;

      if (month > 11) {
        month = 0;
        year++;
      }
    }
  });
  // ログインオーブ
const oneDay = 24 * 60 * 60 * 1000;

const startDay = new Date(
  rangeStart.getFullYear(),
  rangeStart.getMonth(),
  rangeStart.getDate()
);

const endDay = new Date(
  rangeEnd.getFullYear(),
  rangeEnd.getMonth(),
  rangeEnd.getDate()
);

const days =
  Math.round((endDay - startDay) / oneDay) + 1;

const loginOrbs = days * 2;

const loginRow = document.createElement("div");

loginRow.innerHTML = `
  <label>
    <input
      type="checkbox"
      class="forecast-event"
      data-orb="${loginOrbs}"
      checked
    >

    <img
      src="images/login.png"
      class="forecast-event-icon"
      alt="ログインオーブ"
    >

    ログインオーブ
    （${formatForecastDate(rangeStart)}
    ～${formatForecastDate(rangeEnd)}）
    ：${loginOrbs}個
  </label>
`;

forecastEventList.appendChild(loginRow);


// 轟絶ボーナス
let gouzetsuOrbs = 0;
let gouzetsuCount = 0;

if (gouzetsuStart.value) {
  const start = new Date(gouzetsuStart.value);
  const oneWeek = 7 * oneDay;

  let nextReward =
    new Date(start.getTime() + oneWeek);

  while (nextReward <= rangeEnd) {
    if (nextReward >= rangeStart) {
      gouzetsuOrbs += 5;
      gouzetsuCount++;
    }

    nextReward =
      new Date(nextReward.getTime() + oneWeek);
  }
}

const gouzetsuRow = document.createElement("div");

gouzetsuRow.innerHTML = `
  <label>
    <input
      type="checkbox"
      class="forecast-event"
      data-orb="${gouzetsuOrbs}"
      checked
    >

    <img
      src="images/gouzetsu.avif"
      class="forecast-event-icon"
      alt="轟絶ボーナス"
    >

    轟絶ボーナス
    （期間内${gouzetsuCount}回）
    ：${gouzetsuOrbs}個
  </label>
`;

forecastEventList.appendChild(gouzetsuRow);
    saveData();
  }

  function loadData() {
    const savedData =
      localStorage.getItem("monstOrbData");

    if (savedData !== null) {
      const checkedData =
        JSON.parse(savedData);

      checkboxes.forEach(function(checkbox) {
        if (
          checkedData[checkbox.id] !== undefined
        ) {
          checkbox.checked =
            checkedData[checkbox.id];
        }
      });
    }
  }

  function formatTime(diff) {
    const days = Math.floor(
      diff / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
      (diff / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
      (diff / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
      (diff / 1000) % 60
    );

    return (
      days + "日 " +
      hours + "時間 " +
      minutes + "分 " +
      seconds + "秒"
    );
  }

  function updateContents() {
    const now = new Date();

    currentTime.textContent =
      now.toLocaleString("ja-JP");

    contentsData.forEach(function(content) {
      const period = getPeriod(content);

      const startDate = period.start;
      const endDate = period.end;

      const countdown =
        document.getElementById(
          content.id + "Countdown"
        );

      if (now < startDate) {

        countdown.textContent =
          "開催まで：" +
          formatTime(startDate - now);

      } else if (now <= endDate) {

        if (content.monthlyReset) {
          countdown.textContent =
            "次回リセットまで：" +
            formatTime(endDate - now);
        } else {
          countdown.textContent =
            "終了まで：" +
            formatTime(endDate - now);
        }

      } else {
        countdown.textContent = "";
      }
    });
  }
checkboxes.forEach(function(checkbox) {
  checkbox.addEventListener(
    "change",
    updateForecastTotal
  );
});

resetButton.addEventListener("click", function() {
  checkboxes.forEach(function(checkbox) {
    checkbox.checked = false;
  });

  localStorage.removeItem("monstOrbData");
});

const savedGouzetsuStart =
  localStorage.getItem("gouzetsuStart");

if (savedGouzetsuStart !== null) {
  gouzetsuStart.value = savedGouzetsuStart;
}

gouzetsuStart.addEventListener(
  "change",
  function() {
    localStorage.setItem(
      "gouzetsuStart",
      gouzetsuStart.value
    );

    calculateTotal();
  }
);

resetLoginButton.addEventListener("click", function() {
  const now = new Date();

  localStorage.setItem(
    "loginOrbStart",
    now.toISOString()
  );

  calculateLoginOrb();
  calculateTotal();
});

selectAllForecast.addEventListener(
  "click",
  function() {
    document
      .querySelectorAll(".forecast-event")
      .forEach(function(checkbox) {
        checkbox.checked = true;
      });

    updateForecastTotal();
  }
);

clearAllForecast.addEventListener(
  "click",
  function() {
    document
      .querySelectorAll(".forecast-event")
      .forEach(function(checkbox) {
        checkbox.checked = false;
      });

    updateForecastTotal();
  }
);

updateForecastTotal();

forecastStart.addEventListener(
  "change",
  function() {
    if (
      forecastStart.value &&
      forecastEnd.value
    ) {
      generateForecastEvents();
      updateForecastTotal();
    }
  }
);

forecastEnd.addEventListener(
  "change",
  function() {
    if (
      forecastStart.value &&
      forecastEnd.value
    ) {
      generateForecastEvents();
      updateForecastTotal();
    }
  }
);
  loadData();

  updateContents();
  calculateLoginOrb();
  calculateGouzetsuOrb();
  updateForecastTotal();

  setInterval(function() {
  updateContents();
  calculateLoginOrb();
  calculateGouzetsuOrb();
  updateForecastTotal();
}, 1000);
</script>
