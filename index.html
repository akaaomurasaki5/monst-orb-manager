<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンスト オーブ管理</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 30px;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
  }

  .card {
    background-color: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  .card label {
    font-size: 20px;
    cursor: pointer;
  }

  .card input[type="checkbox"] {
  transform: scale(1.4);
  margin-right: 12px;
  }
  .total {
    background-color: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    text-align: center;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid #999;
  }
  .section-title｛
  margin-top: 35px;
  margin-bottom: 15px;
  font-size: 26px;
  }
  .gouzetsu-setting {
  width: 100%;
  box-sizing: border-box;
  margin-top: 15px;
  margin-bottom: 20px;
  padding-right: 10px;
  margin-left: 0;
  padding-left: 0;
}

.gouzetsu-setting label {
  display: block;
  margin-bottom: 10px;
  font-weight: bold;
}

.gouzetsu-setting input {
  display: block;
  width: 300px;
  max-width: 100%;
  box-sizing: border-box;
  padding: 10px;
  font-size: 16px;
  margin-top: 8px;
  margin-left: 0;
}
.content-label {
  display: flex;
  align-items: center;
  gap: 15px;
}

.content-image {
  width: 70px;
  height: 70px;
  object-fit: contain;
  flex-shrink: 0;
}

.content-name {
  font-size: 20px;
}
.bonus-row {
  display: flex;
  align-items: center;
  gap: 15px;
}

.bonus-image {
  width: 70px;
  height: 70px;
  object-fit: contain;
  flex-shrink: 0;
}
</style>
</head>
<body>
  <div class="container">
    <h1>モンスト 定期コンテンツ オーブ管理</h1>
    <p>今月のオーブ獲得状況を管理します。</p>

    <div class="card">
      <h2>現在時刻</h2>
      <p id="currentTime">読み込み中...</p>
    </div>

    <div id="contentList"></div>
<div class="card">
  <h2>自動獲得オーブ</h2>

  <div class="bonus-row">
    <img
      src="images/login.png"
      alt="ログインオーブ"
      class="bonus-image"
    >

    <p>
      ログインオーブ：
      <span id="loginOrbTotal">0</span>個
    </p>
  </div>
  <p>
  獲得オーブ：
  <span id="gouzetsuOrbTotal">0</span>個
</p>

<p id="gouzetsuCountdown">
  開始日時を設定してください
</p>

  <hr>

  <div class="bonus-row">
    <img
      src="images/gouzetsu.avif"
      alt="轟絶ボーナス"
      class="bonus-image"
    >

    <h3>轟絶ボーナス</h3>
  </div>

  <div class="gouzetsu-setting">
    <label for="gouzetsuStart">
      ボーナス開始日時
    </label>

    <input
      type="datetime-local"
      id="gouzetsuStart"
    >
  </div>
<p>
  獲得オーブ：
  <span id="gouzetsuOrbTotal">0</span>個
</p>

<p id="gouzetsuCountdown">
  開始日時を設定してください
</p>
  <button id="resetLoginButton">
    ログインオーブをリセット
  </button>
</div>

    <div class="total">
      <h2>
        獲得オーブ合計：
        <span id="total">0</span>個
      </h2>
      <button id="resetButton">
        今月のデータをリセット
      </button>
    </div>
  </div>

  <script>
  const resetLoginButton =
  document.getElementById("resetLoginButton");
  const contentList = document.getElementById("contentList");
  const total = document.getElementById("total");
  const currentTime = document.getElementById("currentTime");
  const resetButton = document.getElementById("resetButton");
  const loginOrbTotal =
  document.getElementById("loginOrbTotal");

const gouzetsuStart =
  document.getElementById("gouzetsuStart");

const gouzetsuOrbTotal =
  document.getElementById("gouzetsuOrbTotal");

const gouzetsuCountdown =
  document.getElementById("gouzetsuCountdown");

  const contentsData = [
  {
    id: "tenma",
    name: "天魔の孤城",
    icon: "images/tenma.png",
    orb: 5,
    startDay: 1,
    monthlyReset: true
  },
  {
    id: "hasya",
    name: "覇者の塔",
    icon: "images/hasya.png",
    orb: 68,
    startDay: 7,
    endDay: 25,
    crossMonth: false,
  },
  {
    id: "mikai",
    name: "未開の幻洞",
    icon: "images/mikai.png",
    orb: 10,
    startDay: 14,
    endDay: 29,
    crossMonth: false,
  },
  {
    id: "kinki",
    name: "禁忌の獄",
    icon: "images/kinki.png",
    orb: 55,
    startDay: 21,
    endDay: 8,
    crossMonth: true,
  },
  {
    id: "tournament",
    name: "絶級トーナメント",
    icon: "images/tournament.png",
    orb: 30,
    startDay: 26,
    endDay: 6,
    crossMonth: true,
    
  },
  {
    id: "seibo",
    name: "破界の星墓",
    icon: "images/seibo.png",
    orb: 20,
    startDay: 27,
    endDay: 21,
    crossMonth: true,
  }
];

  function getPeriod(content) {
    const now = new Date();

    const year = now.getFullYear();
    const month = now.getMonth();

    // 天魔の孤城：毎月1日12時に更新
    if (content.monthlyReset) {
      let startDate = new Date(
        year,
        month,
        1,
        12,
        0,
        0
      );

      let endDate = new Date(
        year,
        month + 1,
        1,
        12,
        0,
        0
      );

      if (now < startDate) {
        startDate = new Date(
          year,
          month - 1,
          1,
          12,
          0,
          0
        );

        endDate = new Date(
          year,
          month,
          1,
          12,
          0,
          0
        );
      }

      return {
        start: startDate,
        end: endDate
      };
    }

    // 月をまたぐコンテンツ
    if (content.crossMonth) {
      const thisMonthStart = new Date(
        year,
        month,
        content.startDay,
        12,
        0,
        0
      );

      let startDate;
      let endDate;

      if (now >= thisMonthStart) {
        startDate = thisMonthStart;

        endDate = new Date(
          year,
          month + 1,
          content.endDay,
          12,
          0,
          0
        );
      } else {
        const previousStart = new Date(
          year,
          month - 1,
          content.startDay,
          12,
          0,
          0
        );

        const previousEnd = new Date(
          year,
          month,
          content.endDay,
          12,
          0,
          0
        );

        if (now <= previousEnd) {
          startDate = previousStart;
          endDate = previousEnd;
        } else {
          startDate = thisMonthStart;

          endDate = new Date(
            year,
            month + 1,
            content.endDay,
            12,
            0,
            0
          );
        }
      }

      return {
        start: startDate,
        end: endDate
      };
    }

    // 同じ月の中で完結するコンテンツ
    let startDate = new Date(
      year,
      month,
      content.startDay,
      12,
      0,
      0
    );

    let endDate = new Date(
      year,
      month,
      content.endDay,
      12,
      0,
      0
    );

    if (now > endDate) {
      startDate = new Date(
        year,
        month + 1,
        content.startDay,
        12,
        0,
        0
      );

      endDate = new Date(
        year,
        month + 1,
        content.endDay,
        12,
        0,
        0
      );
    }

    return {
      start: startDate,
      end: endDate
    };
  }
function getStatusOrder(content) {
  const now = new Date();
  const period = getPeriod(content);

  if (now >= period.start && now <= period.end) {
    return 0; // 開催中
  }

  if (now < period.start) {
    return 1; // 開催前
  }

  return 2; // 終了
}

const displayOrder = [
  "tenma",
  "hasya",
  "mikai",
  "kinki",
  "tournament",
  "seibo"
];

contentsData.sort(function(a, b) {
  const statusA = getStatusOrder(a);
  const statusB = getStatusOrder(b);

  if (statusA !== statusB) {
    return statusA - statusB;
  }

  return (
    displayOrder.indexOf(a.id) -
    displayOrder.indexOf(b.id)
  );
});
  function createContents() {
  contentList.innerHTML = "";

  let currentGroup = "";

  contentsData.forEach(function(content) {
    const now = new Date();
    const period = getPeriod(content);

    let groupName = "";

    if (now >= period.start && now <= period.end) {
      groupName = "開催中";
    } else if (now < period.start) {
      groupName = "開催前";
    } else {
      groupName = "終了";
    }

    // グループが変わったら見出しを追加
    if (groupName !== currentGroup) {
      const heading = document.createElement("h2");
      heading.className = "section-title";
      heading.textContent = groupName;

      contentList.appendChild(heading);

      currentGroup = groupName;
    }

    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = content.id;

    card.innerHTML = `
  <label class="content-label">
    <input
      type="checkbox"
      class="content"
      id="${content.id}"
      data-orb="${content.orb}"
    >

    <img
      src="${content.icon}"
      alt="${content.name}"
      class="content-image"
    >

    <span class="content-name">
      ${content.name}：${content.orb}個
    </span>
  </label>

  <p id="${content.id}Countdown">
    計算中...
  </p>
`;

    contentList.appendChild(card);
  });
  }

  createContents();

  const checkboxes =
    document.querySelectorAll(".content");
function calculateLoginOrb() {
  const now = new Date();

  let savedStart =
    localStorage.getItem("loginOrbStart");

  let startDate;

  if (savedStart === null) {
    // 初回は今月1日から計算
    startDate = new Date(
      now.getFullYear(),
      now.getMonth(),
      1,
      0,
      0,
      0
    );

    localStorage.setItem(
      "loginOrbStart",
      startDate.toISOString()
    );
  } else {
    startDate = new Date(savedStart);
  }

  const oneDay =
    24 * 60 * 60 * 1000;

  const daysPassed =
    Math.floor(
      (now - startDate) / oneDay
    );

  const orb =
    Math.max(daysPassed, 0) * 2;

  loginOrbTotal.textContent = orb;

  return orb;
}

function calculateGouzetsuOrb() {
  if (!gouzetsuStart.value) {
    gouzetsuOrbTotal.textContent = "0";
    gouzetsuCountdown.textContent =
      "開始日時を設定してください";

    return 0;
  }

  const start = new Date(gouzetsuStart.value);
  const now = new Date();

  const oneWeek =
    7 * 24 * 60 * 60 * 1000;

  const elapsed = now - start;

  if (elapsed < 0) {
    gouzetsuOrbTotal.textContent = "0";
    gouzetsuCountdown.textContent =
      "開始前です";

    return 0;
  }

  const weeksPassed =
    Math.floor(elapsed / oneWeek);

  const orb = weeksPassed * 5;

  gouzetsuOrbTotal.textContent = orb;

  const nextDate =
    new Date(
      start.getTime() +
      (weeksPassed + 1) * oneWeek
    );

  gouzetsuCountdown.textContent =
    "次回獲得まで：" +
    formatTime(nextDate - now);

  return orb;
}
  function calculateTotal() {
  let sum = 0;

  checkboxes.forEach(function(checkbox) {
    if (checkbox.checked) {
      sum += Number(checkbox.dataset.orb);
    }
  });
  resetLoginButton.addEventListener(
  "click",
  function() {
    const now = new Date();

    localStorage.setItem(
      "loginOrbStart",
      now.toISOString()
    );

    calculateTotal();
  }
);

  // 毎日のログインオーブ
  sum += calculateLoginOrb();

  // 轟絶ボーナス
  sum += calculateGouzetsuOrb();

  total.textContent = sum;
}

  function saveData() {
    const checkedData = {};

    checkboxes.forEach(function(checkbox) {
      checkedData[checkbox.id] =
        checkbox.checked;
    });

    localStorage.setItem(
      "monstOrbData",
      JSON.stringify(checkedData)
    );
  }

  function checkForNewPeriod() {
    contentsData.forEach(function(content) {
      const period = getPeriod(content);

      const periodKey =
        period.start.getTime() +
        "_" +
        period.end.getTime();

      const storageKey =
        content.id + "_period";

      const savedPeriod =
        localStorage.getItem(storageKey);

      if (savedPeriod === null) {
        localStorage.setItem(
          storageKey,
          periodKey
        );

        return;
      }

      if (savedPeriod !== periodKey) {
        const checkbox =
          document.getElementById(content.id);

        checkbox.checked = false;

        localStorage.setItem(
          storageKey,
          periodKey
        );
      }
    });

    saveData();
  }

  function loadData() {
    const savedData =
      localStorage.getItem("monstOrbData");

    if (savedData !== null) {
      const checkedData =
        JSON.parse(savedData);

      checkboxes.forEach(function(checkbox) {
        if (
          checkedData[checkbox.id] !== undefined
        ) {
          checkbox.checked =
            checkedData[checkbox.id];
        }
      });
    }

    checkForNewPeriod();
    calculateTotal();
  }

  function formatTime(diff) {
    const days = Math.floor(
      diff / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
      (diff / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
      (diff / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
      (diff / 1000) % 60
    );

    return (
      days + "日 " +
      hours + "時間 " +
      minutes + "分 " +
      seconds + "秒"
    );
  }

  function updateContents() {
    const now = new Date();

    currentTime.textContent =
      now.toLocaleString("ja-JP");

    contentsData.forEach(function(content) {
      const period = getPeriod(content);

      const startDate = period.start;
      const endDate = period.end;

      const countdown =
        document.getElementById(
          content.id + "Countdown"
        );

      if (now < startDate) {

        countdown.textContent =
          "開催まで：" +
          formatTime(startDate - now);

      } else if (now <= endDate) {

        if (content.monthlyReset) {
          countdown.textContent =
            "次回リセットまで：" +
            formatTime(endDate - now);
        } else {
          countdown.textContent =
            "終了まで：" +
            formatTime(endDate - now);
        }

      } else {
        countdown.textContent = "";
      }
    });
  }

  checkboxes.forEach(function(checkbox) {
    checkbox.addEventListener(
      "change",
      function() {
        calculateTotal();
        saveData();
      }
    );
  });

  resetButton.addEventListener(
    "click",
    function() {
      checkboxes.forEach(function(checkbox) {
        checkbox.checked = false;
      });

      localStorage.removeItem(
        "monstOrbData"
      );

      calculateTotal();
    }
  );
const savedGouzetsuStart =
  localStorage.getItem("gouzetsuStart");

if (savedGouzetsuStart !== null) {
  gouzetsuStart.value = savedGouzetsuStart;
}

gouzetsuStart.addEventListener(
  "change",
  function() {
    localStorage.setItem(
      "gouzetsuStart",
      gouzetsuStart.value
    );

    calculateTotal();
  }
);
  loadData();
  updateContents();

  setInterval(function() {
  updateContents();
  checkForNewPeriod();
  calculateTotal();
}, 1000);
</script>
</body>

</div>
  <script>

const hasyaCountdown = document.getElementById("hasyaCountdown");

// テスト用の開催期間

function formatTime(diff) {

  const hours = Math.floor(
    (diff / (1000 * 60 * 60)) % 24
  );

  );

  return (

  );
}

    function saveData() {
      const checkedData = [];

      contents.forEach(function(content) {
        checkedData.push(content.checked);
      });

      localStorage.setItem(
        "monstOrbData",

        contents.forEach(function(content, index) {
          content.checked = checkedData[index];
        });
      }

      calculateTotal();
    }

    contents.forEach(function(content) {
      content.addEventListener("change", function() {
        calculateTotal();
        saveData();
      });
    });
const resetButton = document.getElementById("resetButton");

resetButton.addEventListener("click", function() {
  contents.forEach(function(content) {
    content.checked = false;
  });

  localStorage.removeItem("monstOrbData");
  calculateTotal();
});

    loadData();
    const currentTime = document.getElementById("currentTime");
const countdown = document.getElementById("countdown");

// テスト用：2026年8月20日 12:00までカウントダウン
const targetDate = new Date("2026-08-20T12:00:00+09:00");

function updateTime() {
  const now = new Date();

  currentTime.textContent = now.toLocaleString("ja-JP");

  const diff = targetDate - now;

  if (diff <= 0) {
    countdown.textContent = "終了しました";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor(
    (diff / (1000 * 60 * 60)) % 24
  );
  const minutes = Math.floor(
    (diff / (1000 * 60)) % 60
  );
  const seconds = Math.floor(
    (diff / 1000) % 60
  );

  countdown.textContent =
    days + "日 " +
    hours + "時間 " +
    minutes + "分 " +
    seconds + "秒";
}

updateTime();
setInterval(updateTime, 1000);
  </script>
</body>
